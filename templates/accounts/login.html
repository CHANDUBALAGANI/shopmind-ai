{% extends 'base.html' %}

{% block content %}

<style>

/* =========================
   LOGIN PAGE
========================= */

.login-page {
    min-height: 78vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 50px 15px;
}


/* =========================
   LOGIN CARD
========================= */

.login-card {
    width: 100%;
    max-width: 460px;

    background: #ffffff;

    border: 1px solid #e5e7eb;
    border-radius: 20px;

    padding: 40px;

    box-shadow:
        0 20px 50px
        rgba(17, 24, 39, 0.10);
}


/* =========================
   BRAND ICON
========================= */

.login-brand-icon {
    width: 58px;
    height: 58px;

    margin: 0 auto 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111827;

    border-radius: 18px;

    font-size: 30px;
}


/* =========================
   HEADER
========================= */

.login-title {
    color: #111827;

    font-size: 28px;
    font-weight: 700;

    text-align: center;

    margin-bottom: 8px;
}


.login-subtitle {
    color: #6b7280;

    font-size: 14px;

    text-align: center;

    margin-bottom: 30px;
}


/* =========================
   FORM
========================= */

.login-form-group {
    margin-bottom: 20px;
}


.login-form-group label {
    display: block;

    color: #374151;

    font-size: 14px;
    font-weight: 600;

    margin-bottom: 8px;
}


.login-form-group input {
    width: 100%;

    height: 48px;

    padding: 0 14px;

    border: 1px solid #d1d5db;
    border-radius: 10px;

    outline: none;

    font-size: 14px;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}


.login-form-group input:focus {
    border-color: #111827;

    box-shadow:
        0 0 0 3px
        rgba(17, 24, 39, 0.08);
}


/* =========================
   ERROR MESSAGE
========================= */

.login-error {
    margin-bottom: 20px;

    padding: 12px 14px;

    background: #fef2f2;

    border: 1px solid #fecaca;
    border-radius: 10px;

    color: #b91c1c;

    font-size: 13px;

    text-align: center;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-submit-btn {
    width: 100%;

    height: 50px;

    border: none;
    border-radius: 11px;

    background: #111827;

    color: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    margin-top: 6px;

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}


.login-submit-btn:hover {
    transform: translateY(-1px);

    opacity: 0.92;
}


/* =========================
   REGISTER SECTION
========================= */

.login-divider {
    border: none;

    border-top: 1px solid #e5e7eb;

    margin: 28px 0 22px;
}


.login-register-text {
    text-align: center;

    color: #6b7280;

    font-size: 14px;

    margin: 0;
}


.login-register-text a {
    color: #111827;

    font-weight: 600;

    text-decoration: none;
}


.login-register-text a:hover {
    text-decoration: underline;
}


/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 576px) {

    .login-page {
        padding: 25px 10px;
    }


    .login-card {
        padding: 28px 20px;

        border-radius: 16px;
    }


    .login-title {
        font-size: 24px;
    }

}

</style>


<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login-page">

    <div class="login-card">


        <!-- Brand -->

        <div class="login-brand-icon">
            🤖
        </div>


        <h2 class="login-title">
            Welcome back
        </h2>


        <p class="login-subtitle">
            Log in to continue shopping with ShopMind AI.
        </p>


        <!-- Login Form -->

        <form method="POST">

            {% csrf_token %}


            {% if form.errors %}

                <div class="login-error">

                    Invalid username or password.
                    Please try again.

                </div>

            {% endif %}


            <!-- Username -->

            <div class="login-form-group">

                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="login-form-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-submit-btn"
            >
                Log In →
            </button>


        </form>


        <!-- Register Link -->

        <hr class="login-divider">


        <p class="login-register-text">

            Don't have an account?

            <a href="{% url 'register' %}">

                Create an account

            </a>

        </p>


    </div>

</div>

{% endblock %}
