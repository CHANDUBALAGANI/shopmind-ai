<!-- ==========================
        CATEGORIES
========================== -->

<section class="mb-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold">

            Explore Categories

        </h2>

        <p class="text-muted">

            Browse products by category.

        </p>

    </div>

    <div class="row g-4">

        <!-- All Products -->

        <div class="col-lg-3 col-md-4 col-6">

            <a href="/{% if request.GET.search %}?search={{ request.GET.search }}{% endif %}"
               class="text-decoration-none">

                <div class="card category-card text-center p-4 h-100

                    {% if not selected_category %}

                        border-primary

                    {% endif %}">

                    <div class="display-5">

                        ⭐

                    </div>

                    <h5 class="mt-3">

                        All Products

                    </h5>

                </div>

            </a>

        </div>

        {% for category in categories %}

        <div class="col-lg-3 col-md-4 col-6">

            <a href="?category={{ category.id }}{% if request.GET.search %}&search={{ request.GET.search }}{% endif %}{% if selected_sort %}&sort={{ selected_sort }}{% endif %}"
               class="text-decoration-none">

                <div class="card category-card text-center p-4 h-100

                    {% if selected_category == category.id|stringformat:'s' %}

                        border-primary

                    {% endif %}">

                    <div class="display-5">

                        {{ category.icon }}

                    </div>

                    <h5 class="mt-3">

                        {{ category.name }}

                    </h5>

                </div>

            </a>

        </div>

        {% endfor %}

    </div>

</section>
